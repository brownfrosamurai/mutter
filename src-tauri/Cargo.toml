[package]
name = "mutter"
version = "0.1.1"
description = "Local-first, multi-language speech-to-text dictation for macOS"
edition = "2021"
rust-version = "1.75"

# Named distinctly from the binary target below — standard Tauri 2
# convention (`{package}_lib`), since a mobile build target needs the
# library as a cdylib/staticlib and can't share a name with the bin target.
[lib]
name = "mutter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

# See https://tauri.app/v1/api/config/#build for build script config
[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles native/system_audio_shim.m — the minimal build-time Objective-C
# shim for ScreenCaptureKit (see capture/system_audio.rs), not hand-written
# Swift source, per CLAUDE.md's hard constraint.
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture
cpal = "0.15"

# Speech-to-text engine (whisper.cpp bindings). Phase 0 spike (Section 14)
# resolved: whisper-rs's native whisper.cpp/ggml build compiles cleanly on
# this toolchain — no CLI shell-out or raw FFI fallback needed. `metal`
# turns on whisper.cpp's Metal GPU backend at build time — without it the
# crate defaults to CPU-only inference (whisper-rs's own `default = []`),
# which is why enabling it is the highest-leverage speed lever available:
# `WhisperContextParameters::default()`'s `use_gpu` is literally
# `cfg!(feature = "_gpu")`, so turning this feature on is enough — no code
# change needed in engine/whisper.rs to pick it up.
whisper-rs = { version = "0.12", features = ["metal"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

# Local-LLM grammar/word-choice cleanup (Section 5, "Option B") — see
# engine/llm_cleanup.rs. Pure-Rust `candle` (Hugging Face's ML framework),
# not `llama-cpp-2` — verified live 2026-08-30 that llama-cpp-2 cannot
# safely coexist with whisper-rs in this binary: both statically link their
# own independently-vendored copy of GGML, the linker reports hundreds of
# duplicate-symbol warnings (visible with llama-cpp-2 added) and doesn't
# hard-error on macOS, silently picking one definition per symbol — proven
# to actually corrupt behavior, not just a cosmetic warning: the exact same
# GGUF file that loads perfectly in a standalone llama-cpp-2-only binary
# fails with spurious "tensor is duplicated" errors once whisper-rs-sys is
# also linked in, and the specific tensor reported changed between two
# unrelated GGUF files, which only makes sense as loader corruption, not
# two coincidentally-bad files. `candle` has no vendored C/GGML dependency
# at all (its GPU backends are pure Rust + Metal/CUDA bindings), so it
# can't collide with whisper-rs-sys the same way.
candle = { package = "candle-core", version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
tokenizers = "0.23"

# Local history storage
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"

# Logging (local-only, metadata-only — never audio/transcript content)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"

# Async trait support (stable async fn in traits doesn't yet support
# object-safety the way this codebase needs it — revisit if/when it does)
async-trait = "0.1"

# macOS Accessibility API (AXUIElement) for insert-at-cursor, plus the
# clipboard-swap + synthetic-paste fallback for apps (terminals) that don't
# expose a settable AX attribute. See injection.rs.
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-foundation-sys = "0.8"
core-graphics = "0.25.0" # synthetic Cmd+V via CGEvent
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["alloc", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] } # NSPasteboard
tracing-appender = "0.2"

# Auto-generates TypeScript types + typed invoke() wrappers directly from the
# #[tauri::command] definitions below (frontend/src/lib/bindings.ts) — see
# docs/mutter-project-plan.md's frontend-rewrite plan for why: this project
# has already been bitten once by hand-maintained JS/Rust shape drift (the
# `Transcript` struct deviation), and this removes that whole class of bug.
specta = { version = "2.0.0-rc", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"

[dev-dependencies]
# WAV decoding for the fixture-audio integration test only (tests/fixture_audio.rs)
# — never a runtime dependency, whisper.rs takes raw f32 samples directly.
hound = "3"

[features]
# Empty for now — custom-protocol is added automatically by tauri-build in
# release configs; no manual feature flags needed at scaffold time.
default = []

[[bin]]
name = "mutter"
path = "src/main.rs"
