name: CI

# Phase 7 (Production hardening, docs/mutter-project-plan.md Section 11/15):
# check/test/clippy/fmt now run on every push — clippy and fmt were verified
# clean against the real Phase 0-5 codebase before being made a required gate
# here (not added speculatively against code that didn't exist yet).
#
# Phase 7 items still open, deliberately not faked here:
#   - ad-hoc code signing + notarization-deferred build (needs a real signing
#     identity — see CLAUDE.md's "Stable ad-hoc signing identity" note)
#   - Ed25519 update-signature verification test (no update manifest/keys
#     exist yet — tauri-plugin-updater is a dependency but inactive in
#     tauri.conf.json)
#   - an integration test running fixture audio through the full pipeline
#     per registered engine (Section 11) — needs a real, checked-in audio
#     fixture and a downloaded model, deliberately not added as a CI-blocking
#     step given the ~500MB model download that would require

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features
