name: CI

# Phase 7 (Production hardening, docs/mutter-project-plan.md Section 11/15):
# check/test/clippy/fmt now run on every push — clippy and fmt were verified
# clean against the real Phase 0-5 codebase before being made a required gate
# here (not added speculatively against code that didn't exist yet).
#
# Phase 7 items still open, deliberately not faked here:
#   - ad-hoc code signing + notarization-deferred build (needs a real signing
#     identity — see CLAUDE.md's "Stable ad-hoc signing identity" note)
#   - Ed25519 update-signature verification test (no update manifest/keys
#     exist yet — tauri-plugin-updater is a dependency but inactive in
#     tauri.conf.json)
#   - the fixture-audio integration test (src-tauri/tests/fixture_audio.rs,
#     Section 11) now exists and is real (a checked-in synthesized-speech
#     WAV run through the actual WhisperEngine) but stays `#[ignore]`d and
#     out of this workflow — `cargo test` above does not pass `--ignored`,
#     so it never runs here. Rationale unchanged: a ~500MB model download
#     per CI run isn't worth adding as a required, non-cached gate for v1

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features

  frontend:
    # Not previously covered by CI at all — a PR that broke `tsc -b` would
    # have gone green. `beforeBuildCommand`/`beforeDevCommand` both depend
    # on this build succeeding (CLAUDE.md), so it's a required gate now
    # that branch protection depends on named status checks passing.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: npm run build (tsc -b && vite build)
        run: npm run build --prefix frontend
